<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FB Queue Poster</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#0a0e1a;
  --surface:#111827;
  --surface2:#1a2235;
  --border:#1e2d45;
  --border2:#2a3f5f;
  --blue:#3b82f6;
  --blue-dim:#1d4ed8;
  --cyan:#22d3ee;
  --green:#10b981;
  --amber:#f59e0b;
  --red:#ef4444;
  --text:#e2e8f0;
  --text2:#94a3b8;
  --text3:#475569;
  --mono:'IBM Plex Mono',monospace;
  --sans:'IBM Plex Sans Thai',sans-serif;
}

body{
  font-family:var(--sans);
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  padding:0;
}

/* grid layout */
.app{
  display:grid;
  grid-template-columns:320px 1fr;
  grid-template-rows:56px 1fr;
  height:100vh;
  overflow:hidden;
}

/* topbar */
.topbar{
  grid-column:1/-1;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  padding:0 20px;
  gap:16px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo-icon{
  width:30px;height:30px;
  background:var(--blue);
  border-radius:8px;
  display:flex;align-items:center;justify-content:center;
}

.logo-icon svg{fill:white;width:18px;height:18px}

.logo-text{
  font-size:15px;font-weight:700;
  background:linear-gradient(90deg,var(--blue),var(--cyan));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  letter-spacing:-0.3px;
}

.topbar-sep{width:1px;height:24px;background:var(--border);margin:0 4px}

.queue-count{
  font-family:var(--mono);
  font-size:12px;
  color:var(--text2);
}

.queue-count span{color:var(--cyan);font-weight:500}

.topbar-right{margin-left:auto;display:flex;gap:10px;align-items:center}

.btn{
  padding:7px 16px;
  border-radius:7px;
  font-size:13px;font-weight:600;
  font-family:var(--sans);
  cursor:pointer;border:none;
  transition:all .15s;
}

.btn-ghost{
  background:transparent;
  color:var(--text2);
  border:1px solid var(--border2);
}
.btn-ghost:hover{background:var(--surface2);color:var(--text)}

.btn-primary{
  background:var(--blue);
  color:white;
}
.btn-primary:hover{background:var(--blue-dim)}
.btn-primary:disabled{background:var(--border2);color:var(--text3);cursor:not-allowed}

.btn-success{background:var(--green);color:white}
.btn-success:hover{filter:brightness(1.1)}
.btn-success:disabled{background:var(--border2);color:var(--text3);cursor:not-allowed}

/* sidebar */
.sidebar{
  background:var(--surface);
  border-right:1px solid var(--border);
  overflow-y:auto;
  display:flex;
  flex-direction:column;
}

.sidebar-section{
  padding:16px;
  border-bottom:1px solid var(--border);
}

.section-label{
  font-size:10px;font-weight:700;
  letter-spacing:1.5px;
  color:var(--text3);
  text-transform:uppercase;
  margin-bottom:12px;
}

.field{margin-bottom:12px}
.field:last-child{margin-bottom:0}

label{
  display:block;
  font-size:12px;font-weight:600;
  color:var(--text2);
  margin-bottom:5px;
}

input[type=text],input[type=datetime-local],textarea,select{
  width:100%;
  padding:8px 10px;
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:7px;
  font-size:13px;
  font-family:var(--sans);
  color:var(--text);
  outline:none;
  transition:border-color .15s;
}

input:focus,textarea:focus{border-color:var(--blue)}
textarea{resize:vertical;min-height:72px;line-height:1.5}

input[type=datetime-local]::-webkit-calendar-picker-indicator{
  filter:invert(0.6);cursor:pointer;
}

.verify-row{display:flex;gap:6px}
.verify-row input{flex:1}
.btn-verify{
  padding:8px 12px;
  background:var(--surface2);
  border:1px solid var(--border2);
  border-radius:7px;
  font-size:12px;font-weight:600;
  color:var(--text2);
  cursor:pointer;white-space:nowrap;
  font-family:var(--sans);
  transition:all .15s;
}
.btn-verify:hover{background:var(--border);color:var(--text)}

.token-ok{font-size:11px;color:var(--green);margin-top:4px;display:none}
.token-fail{font-size:11px;color:var(--red);margin-top:4px;display:none}

/* upload */
.upload-zone{
  border:1.5px dashed var(--border2);
  border-radius:9px;
  padding:20px;
  text-align:center;
  cursor:pointer;
  position:relative;
  transition:all .2s;
  background:var(--bg);
}
.upload-zone:hover{border-color:var(--blue);background:#0d1626}
.upload-zone.has-file{border-color:var(--green);border-style:solid}
.upload-zone input[type=file]{
  position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;
}
.upload-icon{font-size:24px;margin-bottom:6px}
.upload-text{font-size:12px;font-weight:600;color:var(--text2)}
.upload-sub{font-size:11px;color:var(--text3);margin-top:3px}
.file-tag{
  display:none;
  background:var(--surface2);
  border:1px solid var(--border2);
  border-radius:6px;
  padding:6px 10px;
  margin-top:8px;
  font-size:12px;
  color:var(--green);
  align-items:center;gap:6px;
}
.file-tag.show{display:flex}
.file-tag span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rm-file{background:none;border:none;color:var(--red);cursor:pointer;font-size:14px;padding:0 2px}

/* toggle */
.toggle-row{
  display:flex;align-items:center;gap:10px;
  cursor:pointer;margin-bottom:10px;
}
.sw{
  width:36px;height:20px;
  background:var(--border2);
  border-radius:10px;position:relative;
  transition:background .2s;flex-shrink:0;
}
.sw.on{background:var(--blue)}
.sw::after{
  content:'';position:absolute;
  width:14px;height:14px;
  background:white;border-radius:50%;
  top:3px;left:3px;
  transition:left .2s;
}
.sw.on::after{left:19px}
.toggle-label{font-size:13px;font-weight:600;color:var(--text2)}

.sched-field{display:none}
.sched-field.show{display:block}

.btn-add{
  width:100%;
  padding:10px;
  background:linear-gradient(135deg,var(--blue),#6366f1);
  color:white;border:none;border-radius:8px;
  font-size:14px;font-weight:700;
  font-family:var(--sans);
  cursor:pointer;
  transition:filter .15s,transform .1s;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.btn-add:hover{filter:brightness(1.1)}
.btn-add:active{transform:scale(0.98)}

/* queue panel */
.queue-panel{
  overflow-y:auto;
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:0;
}

.empty-state{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100%;
  gap:12px;
  color:var(--text3);
}
.empty-icon{font-size:48px;opacity:.3}
.empty-text{font-size:14px}

/* queue item */
.queue-item{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:10px;
  padding:14px;
  margin-bottom:10px;
  position:relative;
  transition:border-color .2s, transform .15s;
}
.queue-item:hover{border-color:var(--border2)}

.qi-header{
  display:flex;align-items:center;gap:10px;
  margin-bottom:10px;
}

.qi-num{
  font-family:var(--mono);
  font-size:11px;font-weight:500;
  color:var(--blue);
  background:#1d2d45;
  padding:3px 8px;
  border-radius:5px;
  flex-shrink:0;
}

.qi-file{
  font-size:13px;font-weight:600;
  color:var(--text);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  flex:1;
}

.qi-actions{display:flex;gap:6px;flex-shrink:0}

.qi-btn{
  width:28px;height:28px;
  border-radius:6px;border:1px solid var(--border2);
  background:transparent;
  color:var(--text2);
  cursor:pointer;font-size:14px;
  display:flex;align-items:center;justify-content:center;
  transition:all .15s;
}
.qi-btn:hover{background:var(--surface2);color:var(--text)}
.qi-btn.del:hover{border-color:var(--red);color:var(--red);background:#1f1015}

.qi-meta{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  margin-bottom:8px;
}

.qi-chip{
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:6px;
  padding:5px 8px;
  font-size:11px;
  color:var(--text2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.qi-chip .chip-label{
  font-size:10px;font-weight:700;
  color:var(--text3);
  letter-spacing:.5px;
  text-transform:uppercase;
  display:block;margin-bottom:2px;
}
.qi-chip span{color:var(--text)}

.qi-status{
  display:flex;align-items:center;gap:6px;
  font-size:12px;font-weight:600;
  padding:5px 8px;
  border-radius:6px;
}

.qi-status.pending{background:#1a2235;color:var(--text2)}
.qi-status.uploading{background:#1a2a1f;color:var(--cyan)}
.qi-status.success{background:#0d2218;color:var(--green)}
.qi-status.error{background:#2a1515;color:var(--red)}
.qi-status.scheduled{background:#1a1f2e;color:#818cf8}

.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.dot-pending{background:var(--text3)}
.dot-uploading{background:var(--cyan);animation:pulse 1s infinite}
.dot-success{background:var(--green)}
.dot-error{background:var(--red)}
.dot-scheduled{background:#818cf8}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.qi-progress{
  height:2px;background:var(--border);border-radius:1px;
  margin-top:8px;overflow:hidden;display:none;
}
.qi-progress.show{display:block}
.qi-progress-fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:1px;transition:width .3s}

/* run summary */
.run-summary{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:10px;
  padding:14px;
  margin-bottom:10px;
  display:none;
}
.run-summary.show{display:block}
.run-summary-title{
  font-size:12px;font-weight:700;
  color:var(--text2);letter-spacing:.5px;
  text-transform:uppercase;margin-bottom:10px;
}
.run-stats{
  display:flex;gap:10px;
}
.run-stat{
  flex:1;
  background:var(--bg);
  border-radius:7px;
  padding:8px;
  text-align:center;
}
.run-stat-num{font-size:22px;font-weight:700;font-family:var(--mono)}
.run-stat-label{font-size:11px;color:var(--text3);margin-top:2px}
.run-stat.done .run-stat-num{color:var(--green)}
.run-stat.fail .run-stat-num{color:var(--red)}
.run-stat.pend .run-stat-num{color:var(--text2)}

/* scrollbar */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

.hint{font-size:11px;color:var(--text3);margin-top:4px}
.hint a{color:var(--blue)}

.tag-sched{
  font-size:10px;font-family:var(--mono);
  background:#1e1a36;color:#818cf8;
  padding:2px 7px;border-radius:4px;
  border:1px solid #312b5c;
}
</style>
</head>
<body>
<div class="app">

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
      </div>
      <span class="logo-text">FB Queue Poster</span>
    </div>
    <div class="topbar-sep"></div>
    <div class="queue-count">คิวทั้งหมด <span id="countDisplay">0</span> โพส</div>
    <div class="topbar-right">
      <button class="btn btn-ghost" onclick="clearAll()">ล้างคิว</button>
      <button class="btn btn-success" id="runBtn" onclick="runQueue()" disabled>▶ โพสทั้งหมด</button>
    </div>
  </div>

  <!-- SIDEBAR -->
  <div class="sidebar">

    <!-- Token -->
    <div class="sidebar-section">
      <div class="section-label">การตั้งค่า</div>
      <div class="field">
        <label>Page Access Token</label>
        <div class="verify-row">
          <input type="text" id="accessToken" placeholder="EAAxxxxxxxx..." autocomplete="off"/>
          <button class="btn-verify" onclick="verifyToken()">ตรวจ</button>
        </div>
        <div class="token-ok" id="tokenOk">✓ Token ใช้งานได้</div>
        <div class="token-fail" id="tokenFail">✕ Token ไม่ถูกต้อง</div>
        <div class="hint">ต้องมีสิทธิ์ pages_manage_posts, publish_video</div>
      </div>
      <div class="field">
        <label>Page ID</label>
        <input type="text" id="pageId" placeholder="เช่น 123456789"/>
      </div>
    </div>

    <!-- Add Post Form -->
    <div class="sidebar-section" style="flex:1;overflow-y:auto">
      <div class="section-label">เพิ่มโพสใหม่</div>

      <div class="field">
        <label>วิดีโอ</label>
        <div class="upload-zone" id="uploadZone">
          <input type="file" id="videoFile" accept="video/*" onchange="onFileSelect(event)"/>
          <div class="upload-icon">🎬</div>
          <div class="upload-text">คลิกเลือกวิดีโอ</div>
          <div class="upload-sub">MP4, MOV, AVI</div>
        </div>
        <div class="file-tag" id="fileTag">
          <span id="fileTagName">-</span>
          <button class="rm-file" onclick="removeFile()">✕</button>
        </div>
      </div>

      <div class="field">
        <label>แคปชั่น</label>
        <textarea id="caption" placeholder="ข้อความประกอบวิดีโอ..."></textarea>
      </div>

      <div class="field">
        <label>คอมเม้นลิงก์</label>
        <input type="text" id="commentLink" placeholder="https://..."/>
      </div>

      <div class="field">
        <label>ข้อความนำหน้าลิงก์</label>
        <input type="text" id="commentText" placeholder="ดูเพิ่มเติม 👉"/>
      </div>

      <div class="field">
        <div class="toggle-row" onclick="toggleSched()">
          <div class="sw" id="schedSw"></div>
          <span class="toggle-label" id="schedLabel">โพสทันที</span>
        </div>
        <div class="sched-field" id="schedField">
          <input type="datetime-local" id="schedTime"/>
          <div class="hint" style="margin-top:4px">ล่วงหน้าอย่างน้อย 10 นาที</div>
        </div>
      </div>

    </div>

    <div style="padding:14px;border-top:1px solid var(--border)">
      <button class="btn-add" onclick="addToQueue()">
        <span style="font-size:18px">+</span> เพิ่มเข้าคิว
      </button>
    </div>
  </div>

  <!-- QUEUE PANEL -->
  <div class="queue-panel" id="queuePanel">

    <div class="run-summary" id="runSummary">
      <div class="run-summary-title">ผลลัพธ์การโพส</div>
      <div class="run-stats">
        <div class="run-stat done"><div class="run-stat-num" id="statDone">0</div><div class="run-stat-label">สำเร็จ</div></div>
        <div class="run-stat fail"><div class="run-stat-num" id="statFail">0</div><div class="run-stat-label">ผิดพลาด</div></div>
        <div class="run-stat pend"><div class="run-stat-num" id="statPend">0</div><div class="run-stat-label">รอโพส</div></div>
      </div>
    </div>

    <div class="empty-state" id="emptyState">
      <div class="empty-icon">📭</div>
      <div class="empty-text">ยังไม่มีโพสในคิว</div>
      <div style="font-size:12px;color:var(--text3)">เพิ่มโพสจากแถบซ้ายได้เลย</div>
    </div>

  </div>
</div>

<script>
let queue = [];
let schedEnabled = false;
let currentFile = null;
let isRunning = false;

function toggleSched(){
  schedEnabled = !schedEnabled;
  document.getElementById('schedSw').classList.toggle('on', schedEnabled);
  document.getElementById('schedLabel').textContent = schedEnabled ? 'ตั้งเวลาโพส' : 'โพสทันที';
  document.getElementById('schedField').classList.toggle('show', schedEnabled);
  if(schedEnabled){
    const d = new Date(Date.now() + 15*60*1000);
    document.getElementById('schedTime').value = d.toISOString().slice(0,16);
  }
}

function onFileSelect(e){
  const f = e.target.files[0];
  if(!f) return;
  currentFile = f;
  document.getElementById('uploadZone').classList.add('has-file');
  document.getElementById('fileTag').classList.add('show');
  document.getElementById('fileTagName').textContent = f.name + ' (' + fmtBytes(f.size) + ')';
}

function removeFile(){
  currentFile = null;
  document.getElementById('videoFile').value = '';
  document.getElementById('uploadZone').classList.remove('has-file');
  document.getElementById('fileTag').classList.remove('show');
}

function fmtBytes(b){
  if(b<1048576) return (b/1024).toFixed(1)+'KB';
  return (b/1048576).toFixed(1)+'MB';
}

function fmtDate(isoStr){
  if(!isoStr) return '-';
  return new Date(isoStr).toLocaleString('th-TH',{
    day:'2-digit',month:'short',year:'2-digit',hour:'2-digit',minute:'2-digit'
  });
}

function addToQueue(){
  const caption = document.getElementById('caption').value.trim();
  const commentLink = document.getElementById('commentLink').value.trim();
  const commentText = document.getElementById('commentText').value.trim();
  const schedTime = schedEnabled ? document.getElementById('schedTime').value : null;

  if(!currentFile) return alert('⚠️ กรุณาเลือกวิดีโอก่อน');
  if(schedEnabled && !schedTime) return alert('⚠️ กรุณาเลือกเวลาโพส');
  if(schedEnabled && new Date(schedTime) <= new Date(Date.now()+9*60*1000))
    return alert('⚠️ ต้องตั้งเวลาล่วงหน้าอย่างน้อย 10 นาที');

  const item = {
    id: Date.now(),
    file: currentFile,
    fileName: currentFile.name,
    fileSize: currentFile.size,
    caption,
    commentLink,
    commentText,
    scheduled: schedEnabled,
    schedTime,
    status: 'pending',
    statusText: 'รอโพส',
    progress: 0,
    postId: null,
    error: null
  };

  queue.push(item);
  renderQueue();
  resetForm();
}

function resetForm(){
  removeFile();
  document.getElementById('caption').value = '';
  document.getElementById('commentLink').value = '';
  document.getElementById('commentText').value = '';
  if(schedEnabled) toggleSched();
}

function removeFromQueue(id){
  queue = queue.filter(q => q.id !== id);
  renderQueue();
}

function renderQueue(){
  const panel = document.getElementById('queuePanel');
  const empty = document.getElementById('emptyState');
  const runBtn = document.getElementById('runBtn');
  document.getElementById('countDisplay').textContent = queue.length;

  // remove old items (keep summary)
  Array.from(panel.querySelectorAll('.queue-item')).forEach(el => el.remove());

  if(queue.length === 0){
    empty.style.display = 'flex';
    runBtn.disabled = true;
    return;
  }

  empty.style.display = 'none';
  runBtn.disabled = isRunning;

  queue.forEach((item, idx) => {
    const el = document.createElement('div');
    el.className = 'queue-item';
    el.id = 'qi-' + item.id;

    const statusClass = item.status;
    const dotClass = 'dot-' + item.status;
    const statusTexts = {
      pending: 'รอโพส',
      uploading: 'กำลังโพส...',
      success: item.scheduled ? 'ตั้งเวลาสำเร็จ' : 'โพสสำเร็จ',
      error: 'ผิดพลาด: ' + (item.error || ''),
      scheduled: 'ตั้งเวลาแล้ว'
    };

    el.innerHTML = `
      <div class="qi-header">
        <div class="qi-num">#${String(idx+1).padStart(2,'0')}</div>
        <div class="qi-file">${item.fileName}</div>
        <div class="qi-actions">
          ${item.status==='pending' ? `<button class="qi-btn del" onclick="removeFromQueue(${item.id})" title="ลบ">✕</button>` : ''}
        </div>
      </div>
      <div class="qi-meta">
        <div class="qi-chip">
          <span class="chip-label">แคปชั่น</span>
          <span>${item.caption || '<span style="color:var(--text3)">ไม่มี</span>'}</span>
        </div>
        <div class="qi-chip">
          <span class="chip-label">คอมเม้นลิงก์</span>
          <span>${item.commentLink || '<span style="color:var(--text3)">ไม่มี</span>'}</span>
        </div>
        <div class="qi-chip" style="grid-column:1/-1">
          <span class="chip-label">เวลาโพส</span>
          <span>${item.scheduled ? '🕐 ' + fmtDate(item.schedTime) : '⚡ ทันที'}</span>
        </div>
      </div>
      <div class="qi-status ${statusClass}">
        <div class="dot ${dotClass}"></div>
        ${statusTexts[item.status] || item.statusText}
        ${item.postId ? `<span style="margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--text3)">ID: ${item.postId}</span>` : ''}
      </div>
      <div class="qi-progress ${item.status==='uploading'?'show':''}" id="prog-${item.id}">
        <div class="qi-progress-fill" id="progfill-${item.id}" style="width:${item.progress}%"></div>
      </div>
    `;
    panel.appendChild(el);
  });

  updateSummary();
}

function updateItemStatus(id, status, extra={}){
  const item = queue.find(q => q.id === id);
  if(!item) return;
  Object.assign(item, {status, ...extra});
  renderQueue();
}

function updateSummary(){
  const done = queue.filter(q=>q.status==='success').length;
  const fail = queue.filter(q=>q.status==='error').length;
  const pend = queue.filter(q=>q.status==='pending').length;
  document.getElementById('statDone').textContent = done;
  document.getElementById('statFail').textContent = fail;
  document.getElementById('statPend').textContent = pend;
  if(done+fail > 0) document.getElementById('runSummary').classList.add('show');
}

async function runQueue(){
  const token = document.getElementById('accessToken').value.trim();
  const pageId = document.getElementById('pageId').value.trim();
  if(!token) return alert('⚠️ กรุณาใส่ Access Token');
  if(!pageId) return alert('⚠️ กรุณาใส่ Page ID');

  const pending = queue.filter(q => q.status === 'pending');
  if(pending.length === 0) return alert('ไม่มีโพสที่รอในคิว');

  isRunning = true;
  document.getElementById('runBtn').disabled = true;

  for(const item of pending){
    await postItem(item, token, pageId);
    await new Promise(r => setTimeout(r, 1500));
  }

  isRunning = false;
  document.getElementById('runBtn').disabled = false;
  renderQueue();
}

async function postItem(item, token, pageId){
  updateItemStatus(item.id, 'uploading', {progress:10});

  try{
    const fd = new FormData();
    fd.append('file', item.file);
    fd.append('description', item.caption);
    fd.append('access_token', token);

    if(item.scheduled){
      const ts = Math.floor(new Date(item.schedTime).getTime()/1000);
      fd.append('published','false');
      fd.append('scheduled_publish_time', ts.toString());
    } else {
      fd.append('published','true');
    }

    item.progress = 30;
    const progFill = document.getElementById('progfill-'+item.id);
    if(progFill) progFill.style.width = '30%';

    const res = await fetch(`https://graph-video.facebook.com/v19.0/${pageId}/videos`,{
      method:'POST', body:fd
    });

    item.progress = 75;
    if(progFill) progFill.style.width = '75%';

    const data = await res.json();
    if(data.error) throw new Error(data.error.message);

    const videoId = data.id;

    // comment link
    if(!item.scheduled && item.commentLink){
      const msg = (item.commentText ? item.commentText + ' ' : '') + item.commentLink;
      await fetch(`https://graph.facebook.com/v19.0/${videoId}/comments`,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({message:msg, access_token:token})
      });
    }

    item.progress = 100;
    if(progFill) progFill.style.width = '100%';

    updateItemStatus(item.id, 'success', {postId: videoId, progress:100});

  } catch(err){
    updateItemStatus(item.id, 'error', {error: err.message});
  }
}

async function verifyToken(){
  const token = document.getElementById('accessToken').value.trim();
  const pageId = document.getElementById('pageId').value.trim();
  const ok = document.getElementById('tokenOk');
  const fail = document.getElementById('tokenFail');
  ok.style.display='none'; fail.style.display='none';
  if(!token){ fail.textContent='⚠️ ใส่ Token ก่อน'; fail.style.display='block'; return; }
  try{
    const url = pageId
      ? `https://graph.facebook.com/v19.0/${pageId}?fields=name&access_token=${token}`
      : `https://graph.facebook.com/v19.0/me?fields=name&access_token=${token}`;
    const r = await fetch(url);
    const d = await r.json();
    if(d.error) throw new Error(d.error.message);
    ok.textContent = '✓ ' + d.name + ' — Token ใช้งานได้';
    ok.style.display='block';
  } catch(e){
    fail.textContent = '✕ ' + e.message;
    fail.style.display='block';
  }
}

function clearAll(){
  if(queue.length===0) return;
  if(!confirm('ล้างคิวทั้งหมด?')) return;
  queue = [];
  document.getElementById('runSummary').classList.remove('show');
  renderQueue();
}

renderQueue();
</script>
